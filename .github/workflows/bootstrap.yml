name: Install validated v0.2.7 sources
on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/publish.trigger'
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify archive and install source files
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/release.part* > /tmp/tla_release.b64
          base64 -d /tmp/tla_release.b64 > /tmp/tla_release.tar.bz2
          echo "2151479d7be972b274e8a7826ff1f33223ae9ddada6bde2390f2e41b56c9dba5  /tmp/tla_release.tar.bz2" | sha256sum -c -
          tar -xjf /tmp/tla_release.tar.bz2 -C .
          rm -rf .bootstrap
          rm .github/workflows/bootstrap.yml
          python -m pip install -r cite-check-tr/scripts/requirements.txt
          python tests/verify_release.py
          python tools/check_repo_hygiene.py --tree
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish Turkish Legal Artifacts v0.2.7"
          git push origin main
